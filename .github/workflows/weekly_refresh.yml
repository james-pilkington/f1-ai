name: Weekly F1 AI Update

# Scheduled cron disabled: GitHub-hosted runners get every FastF1 request
# rejected outright (all data categories fail instantly, even for
# long-completed historical races that fetch fine from a local machine) -
# looks like the shared runner IP range is blocked by the backend FastF1
# talks to. Verified this isn't our request volume or code: the exact same
# code/library versions succeed immediately from a non-GitHub-Actions IP.
# Run refresh_data.sh locally instead (see repo root) until/unless this
# moves to a self-hosted runner.
on:
  workflow_dispatch:  # Manual "Run workflow" only - kept in case GitHub's IP situation changes

permissions:
  contents: write  # Critical: Allows the bot to push changes back to the repo

jobs:
  update-data-and-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 1. Fetch Latest Race Results
        run: python etl_process.py

      - name: 2. Generate Training Features (Practice Data)
        run: python generate_features.py

      - name: 3. Retrain Qualifying Model
        run: python train_model.py

      - name: 4. Generate Master Feature Store
        run: python generate_master_features.py

      - name: 5. Retrain Race Model Suite
        run: python train_master_model.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push if changes exist
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'F1-AI-Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add data/*.parquet data/*.pkl
          git commit -m "🤖 Auto-update: New F1 data & Retrained Model"
          git push